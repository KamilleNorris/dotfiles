onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[ui.sound.agents]
droid = "off"
claude = "off"

[ui]
agent_panel_sort = "spaces"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
